<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level 2 – Hong Kong Monthly Temperature with Daily Trends</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  body { margin: 20px; font: 12px sans-serif; color: #222; background: #fff; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { margin: 0 0 12px; color: #666; }
  .controls { margin-bottom: 10px; }
  .controls button {
    font: inherit; padding: 5px 12px; margin-right: 6px; cursor: pointer;
    border: 1px solid #bbb; border-radius: 4px; background: #fff;
  }
  .controls button.active { background: #333; color: #fff; border-color: #333; }
  .cell { cursor: pointer; }
  .cell-bg { stroke: none; }
  .cell:hover .cell-bg { stroke: #333; stroke-width: 2; }
  .line-max { fill: none; stroke: #2ca02c; stroke-width: 1.8; }
  .line-min { fill: none; stroke: #a6cee3; stroke-width: 1.8; }
  .day-marker { stroke: #333; stroke-width: 1; stroke-dasharray: 2 2; pointer-events: none; }
  .legend text { font-size: 12px; }
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    background: #fff; border: 1px solid #ccc; border-radius: 3px;
    padding: 6px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.15); white-space: nowrap; line-height: 1.5;
  }
</style>
</head>
<body>
<h1>Hong Kong Monthly Temperature with Daily Changes (2008–2017)</h1>
<p class="hint">Cell color = monthly max / min temperature (click a cell or the buttons to switch).
  Lines inside each cell show the daily maximum (green) and daily minimum (light blue).</p>
<div class="controls">
  <button data-mode="max" class="active">Max temperature</button>
  <button data-mode="min">Min temperature</button>
</div>
<svg id="chart"></svg>
<div id="tooltip"></div>

<script>
const MONTHS = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
const N_YEARS = 10;
const parseDate = d3.timeParse("%Y-%m-%d");
const fmtDate = d3.timeFormat("%Y-%m-%d");
let mode = "max";

d3.csv("temperature_daily.csv", d => ({
  date: parseDate(d.date),
  max: +d.max_temperature,
  min: +d.min_temperature
})).then(raw => {
  // Keep only the last N_YEARS years
  const lastYear = d3.max(raw, d => d.date.getFullYear());
  const firstYear = lastYear - N_YEARS + 1;
  const daily = raw.filter(d => d.date.getFullYear() >= firstYear);

  // One record per (year, month), holding monthly aggregates and the daily series
  const data = d3.flatRollup(daily,
      v => {
        const days = v.slice().sort((a, b) => a.date - b.date);
        return { max: d3.max(days, d => d.max), min: d3.min(days, d => d.min), days };
      },
      d => d.date.getFullYear(),
      d => d.date.getMonth())
    .map(([year, month, agg]) => ({ year, month, ...agg }));

  const years = d3.range(firstYear, lastYear + 1);

  // Layout
  const cellW = 90, cellH = 66, pad = 0.12;
  const margin = { top: 30, right: 120, bottom: 10, left: 80 };
  const width = years.length * cellW;
  const height = 12 * cellH;

  const svg = d3.select("#chart")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scaleBand().domain(years).range([0, width]).padding(pad);
  const y = d3.scaleBand().domain(d3.range(12)).range([0, height]).padding(pad);

  g.append("g").call(d3.axisTop(x).tickSizeOuter(0));
  g.append("g").call(d3.axisLeft(y).tickFormat(m => MONTHS[m]).tickSizeOuter(0));

  // Color: 0–40 °C, quantized reversed Spectral (blue = cold, red = hot)
  const N_BINS = 11;
  const color = d3.scaleQuantize()
    .domain([0, 40])
    .range(d3.quantize(t => d3.interpolateSpectral(1 - t), N_BINS));

  // Mini line chart scales, shared by every cell so lines are comparable across cells
  const innerPad = 4;
  const bw = x.bandwidth(), bh = y.bandwidth();
  const dayX = d3.scaleLinear().domain([1, 31]).range([innerPad, bw - innerPad]);
  const tempY = d3.scaleLinear()
    .domain([d3.min(daily, d => d.min), d3.max(daily, d => d.max)])
    .range([bh - innerPad, innerPad]);
  const lineOf = key => d3.line()
    .x(d => dayX(d.date.getDate()))
    .y(d => tempY(d[key]));

  // Cells
  const cells = g.selectAll("g.cell")
    .data(data)
    .join("g")
      .attr("class", "cell")
      .attr("transform", d => `translate(${x(d.year)},${y(d.month)})`);

  cells.append("rect")
    .attr("class", "cell-bg")
    .attr("width", bw)
    .attr("height", bh);

  cells.append("path").attr("class", "line-max").attr("d", d => lineOf("max")(d.days));
  cells.append("path").attr("class", "line-min").attr("d", d => lineOf("min")(d.days));

  const marker = cells.append("line")
    .attr("class", "day-marker")
    .attr("y1", 0).attr("y2", bh)
    .style("display", "none");

  // Tooltip: monthly summary + the day under the cursor
  const tip = d3.select("#tooltip");
  const fmtMonth = d => `${d.year}-${String(d.month + 1).padStart(2, "0")}`;

  cells
    .on("mousemove", function (event, d) {
      const [mx] = d3.pointer(event, this);
      const day = Math.round(dayX.invert(mx));
      const rec = d3.least(d.days, r => Math.abs(r.date.getDate() - day));

      d3.select(this).select(".day-marker")
        .style("display", null)
        .attr("x1", dayX(rec.date.getDate()))
        .attr("x2", dayX(rec.date.getDate()));

      tip.style("display", "block")
         .style("left", (event.pageX + 12) + "px")
         .style("top", (event.pageY - 40) + "px")
         .html(`Date: ${fmtMonth(d)}, max: ${d.max} min: ${d.min}<br>
                ${fmtDate(rec.date)} — max: ${rec.max} min: ${rec.min}`);
    })
    .on("mouseleave", function () {
      d3.select(this).select(".day-marker").style("display", "none");
      tip.style("display", "none");
    })
    .on("click", () => setMode(mode === "max" ? "min" : "max"));

  // Legend: color swatches
  const swH = 22, swW = 18;
  const legend = svg.append("g")
    .attr("class", "legend")
    .attr("transform", `translate(${margin.left + width + 20},${margin.top})`);

  legend.selectAll("rect")
    .data(color.range())
    .join("rect")
      .attr("y", (d, i) => i * swH)
      .attr("width", swW)
      .attr("height", swH)
      .attr("fill", d => d);

  legend.append("text").attr("x", swW + 6).attr("y", 10).text("0 Celsius");
  legend.append("text").attr("x", swW + 6).attr("y", N_BINS * swH).text("40 Celsius");

  // Legend: line meanings
  const lineLegend = legend.append("g").attr("transform", `translate(0,${N_BINS * swH + 30})`);
  [["line-max", "Daily max"], ["line-min", "Daily min"]].forEach(([cls, label], i) => {
    const row = lineLegend.append("g").attr("transform", `translate(0,${i * 20})`);
    row.append("line").attr("class", cls).attr("x1", 0).attr("x2", swW + 4).attr("y1", 0).attr("y2", 0);
    row.append("text").attr("x", swW + 10).attr("y", 4).text(label);
  });

  function setMode(m) {
    mode = m;
    d3.selectAll(".controls button")
      .classed("active", function () { return this.dataset.mode === m; });
    cells.select(".cell-bg").transition().duration(400).attr("fill", d => color(d[mode]));
  }

  d3.selectAll(".controls button").on("click", function () { setMode(this.dataset.mode); });
  setMode("max");
});
</script>
</body>
</html>
